/* Modern responsive UI */
:root{
  --navy:#18324a;
  --blue:#315f7d;
  --bg:#f3f6f9;
  --text:#17283a;
  --muted:#687786;
  --border:#d9e2e9;
  --white:#fff;
  --green:#e8f5ec;
  --greenT:#22613b;
  --amber:#fff6d9;
  --amberT:#765a00;
  --shadow:0 8px 28px rgba(20,42,62,.07);
}
body{-webkit-font-smoothing:antialiased}
.card{box-shadow:var(--shadow);border-color:#e1e8ee;border-radius:16px}
.input,select{min-height:44px;border-radius:10px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,select:focus{border-color:#7899b0;box-shadow:0 0 0 3px rgba(49,95,125,.10)}
.btn{min-height:42px;border-radius:10px;transition:transform .12s,box-shadow .12s,background .12s}
.btn:active{transform:translateY(1px)}
.btn.primary{box-shadow:0 5px 14px rgba(23,50,77,.18)}
.aiBtn{background:#edf4f8;border-color:#c8d8e4;color:var(--navy)}
.top{align-items:center}
.mobileActionBar{display:none}
.bomTools{margin-top:12px}
.quoteHead:hover{background:#f8fafc!important}
.tableWrap{-webkit-overflow-scrolling:touch}

/* Required-gate and guided workflow */
.stepHeader{
  display:flex;align-items:center;gap:10px;margin:2px 0 12px;padding:11px 12px;
  background:#f7fafc;border:1px solid #e0e8ef;border-radius:12px
}
.stepHeader>span,.stepDivider>span{
  display:grid;place-items:center;width:28px;height:28px;border-radius:50%;

}
.stepHeader b{display:block;font-size:13px;color:var(--navy)}
.stepHeader small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.stepDivider{
  grid-column:1/-1;display:flex;align-items:center;gap:8px;
  margin:8px 0 0;padding-top:12px;border-top:1px solid #e5ebf0;color:var(--navy)
}
.stepDivider>span{width:24px;height:24px;font-size:10px}
.stepDivider b{font-size:12px}
.bomStep{margin-top:18px}
.requiredGate{
  display:flex;align-items:center;gap:9px;margin:-2px 0 14px;padding:10px 12px;
  border:1px solid #f0c7c7;background:#fff5f5;border-radius:11px;color:#7c2929
}
.requiredGate b{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.requiredGate span{font-size:11px}
.requiredGate.ready{border-color:#bfe2ca;background:#f1faf4;color:#205d37}
.requiredInput.invalid{border-color:#d55b5b!important;box-shadow:0 0 0 3px rgba(213,91,91,.10)!important}
.requiredInput.valid{border-color:#72a985}
.fieldError{font-size:10px;color:#b33434;margin-top:3px;font-weight:600}
button:disabled,.disabledAction{
  opacity:.45!important;cursor:not-allowed!important;box-shadow:none!important;transform:none!important
}
.customerFirst,.projectFirst{
  background:#fbfcfd;padding:10px;border:1px solid #e4ebf1;border-radius:12px
}
.customerFirst label,.projectFirst label{color:var(--navy);font-weight:800}
@media(max-width:768px){
  .stepHeader{margin-top:0;padding:10px}
  .customerFirst,.projectFirst{padding:9px}
  .requiredGate{position:relative;margin-bottom:10px}
  .stepDivider{margin-top:4px}
}

.notificationRow{width:100%;display:grid;grid-template-columns:10px 1fr;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--border);background:transparent;padding:12px 6px;cursor:pointer;color:var(--text)}

  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:auth.username,password:auth.password,action,data})});
  let body={};try{body=await res.json()}catch{}
  if(!res.ok||body.ok===false)throw new Error(body.error||`Supabase request failed (${res.status})`);
  return body;
}

  adminApi('record',{action,details}).catch(()=>{});
}
async function loadRemoteConfig(){
  const r=await api('quick_load');
  state.role=r.role||state.role;
  state.settings={...DEFAULTS,...(r.defaults||{})};
  state.remoteCatalogue=Array.isArray(r.catalogue)?r.catalogue:[];
  state.remoteByKey=Object.fromEntries(state.remoteCatalogue.map(x=>[x.internalKey,x]));
  return r;
}
function thicknessKey(prefix,mm){
  const n=Number(mm||0);
  if(!Number.isFinite(n)||n<=0)return '';
  return `panel_${prefix}_${n.toFixed(1).replace('.','_')}`;
}
function resolvedInternalKey(localKey){
  if(localKey==='roof15')return thicknessKey('roof',num('roofThickness'));
  if(['wallL1','wallL2','wallL3','wallL4'].includes(localKey)){
    const id=localKey==='wallL1'?'wallL1Thickness':localKey==='wallL2'?'wallL2Thickness':localKey==='wallL3'?'wallL3Thickness':'wallL4Thickness';
    return thicknessKey('wall',num(id));
  }
  if(localKey==='base50')return thicknessKey('base',num('baseThickness'));
  return PRODUCT_KEY_MAP[localKey]||localKey;
}
async function doLogin(){
  loginMsg.textContent='Signing in…';
  const u=loginUser.value.trim().toLowerCase(),p=loginPass.value;
  if(!u||!p){loginMsg.textContent='Username and password required.';return}
  try{
    auth={username:u,password:p};
    const r=await api('login');
    state.role=r.role;
    await loadRemoteConfig();
    sessionStorage.setItem(SESSION,JSON.stringify({username:u,role:state.role}));
    loginMsg.textContent='';
    recordActivity('login');
    start(state.role);
  }catch(e){auth={username:'',password:''};loginMsg.textContent=e.message||'Login failed.'}
}
function start(role){
  state.role=role;loginScreen.classList.add('hidden');app.classList.remove('hidden');setView('calculator');
  refreshNotificationBadge();
  window._notifyTimer=setInterval(refreshNotificationBadge,60000);
}

function activeWallLevels(heightFt){
  const h=Math.max(Number(heightFt)||0,0);
  return {l1:h>0,l2:h>4,l3:h>8,l4:h>12,count:h<=0?0:Math.min(Math.ceil(h/4),4),overMax:h>16};
}

function thicknessLabel(key){
  const map={
    roof15:['roofThickness','Roof'],
    wallL1:['wallL1Thickness','Wall L1'],
    wallL2:['wallL2Thickness','Wall L2'],
    wallL3:['wallL3Thickness','Wall L3'],
    wallL4:['wallL4Thickness','Wall L4'],
    base50:['baseThickness','Base']
  };
  if(!map[key])return null;
  const [id,label]=map[key],v=Number(document.getElementById(id)?.value||0);
  return `${v.toFixed(1)}mm (${label})`;
}

function tankBasis(l,w,h){
  const lp=l/4,wp=w/4,hp=h/4,roof=lp*wp,perimeter=2*(lp+wp),wall=perimeter*hp;
  return {lp,wp,hp,roof,perimeter,wall,total:roof*2+wall};
}
function validGrid(b){return [b.lp,b.wp,b.hp].every(x=>Number.isInteger(x)&&x>=1)}

function originalBom(l,w,h){
  if(l===24&&w===24&&h===8)return clone(VERIFIED_BOM_24_24_8);

  const s=tankBasis(l,w,h),lp=s.lp,wp=s.wp,hp=s.hp;
  const cleatA=Math.max(0,(wp-1)*2);
  const cleatB=Math.ceil(Math.max(0,(lp-1)*(wp-1)))+Math.ceil(Math.max(0,lp-1))*2+Math.ceil(Math.max(0,wp-1))*2;
  const cleatC=Math.ceil(Math.max(0,(lp-1)*2+(wp-1)*2))+Math.ceil(Math.max(0,hp-1))*4;

  const bn58=cleatB*4+(cleatC*2)*2;
  const roofJoint=Math.ceil(lp+1)*wp+Math.ceil(wp+1)*lp;
  const wallJoint=Math.ceil(lp-1)*hp*2+Math.ceil(wp-1)*hp*2;
  const m14=Math.ceil(roofJoint)*17+Math.ceil(wallJoint)*17+hp*4*17;
  const bn38=Math.ceil((lp*Math.ceil(wp+1)+Math.ceil(lp+1)*wp+(lp+wp)*2)*10*1.03);
  const seal45=Math.round(Math.ceil(((hp*Math.ceil(lp-1)+lp*Math.ceil(hp))*2*1.35+((hp*Math.ceil(wp-1)+wp*Math.ceil(hp))*2*1.35))+Math.ceil(roofJoint*1.35)+hp*4*1.22)/10);
  const seal40=Math.ceil(Math.ceil(roofJoint*1.35)/10);

  return {
    manhole:1,
    roof15:Math.max(0,Math.round(lp*wp-1)),
    wallL1:hp>=1?Math.round(s.perimeter):0,
    wallL2:hp>=2?Math.round(s.perimeter):0,
    wallL3:hp>=3?Math.round(s.perimeter):0,
    wallL4:hp>=4?Math.round(s.perimeter):0,
    base50:Math.round(lp*wp),

    roofTrusses:Math.max(0,Math.round(lp-1)),
    roofSupport8:Math.max(0,Math.round((lp+wp)*2)),
    cleatA:Math.round(cleatA),
    cleatB:Math.round(cleatB),
    cleatC:Math.round(cleatC),
    cleatC1:Math.round(cleatC),
    ladderBracket:Math.max(0,Math.round(3*hp)),
    angleStay67_5:Math.max(0,Math.round(Math.ceil(lp-1)*2+Math.ceil(wp-1)*2+hp*4)),
    stay11_3_2:Math.max(0,Math.round(2*hp)),

    extLadder:h,
    intLadder:h,
    airVent:1,
    levelIndicator:h,
    m14BN:Math.round(m14),
    m14Washer:Math.round(m14),
    bnw58:Math.round(bn58),
    bn38:Math.round(bn38),
    m16x40:Math.round(2*bn58),

    sealant45:Math.max(0,seal45),
    sealant40:Math.max(0,seal40),
    butyl8:Math.max(0,Math.round(cleatC*2+1)),
    butyl24:Math.max(0,Math.round(cleatB))
  };
}

function buildBom(l,w,h){
  const basis=tankBasis(l,w,h),qty=originalBom(l,w,h);
  if(document.getElementById('ladder')?.value!=='yes'){qty.extLadder=0;qty.intLadder=0;qty.ladderBracket=0}
  if(document.getElementById('vent')?.value!=='yes')qty.airVent=0;
  if(document.getElementById('level')?.value!=='yes')qty.levelIndicator=0;
  qty.partition=document.getElementById('partitionRequired')?.value==='yes'?Math.max(num('partitionQty'),0):0;

  const rows=BOM_CATALOGUE.map(x=>{
    const internalKey=resolvedInternalKey(x.key),remote=state.remoteByKey[internalKey]||{};
    const generatedQty=Number(qty[x.key]||0);
    const qtyOverride=remote.qtyOverride;
    // Important: an inactive line (for example L3/L4 on an 8 ft tank) always stays zero.
    const effectiveQty=generatedQty<=0?0:(qtyOverride===null||qtyOverride===undefined?generatedQty:Number(qtyOverride||0));
    return {...x,internalKey,item:remote.name||x.item,unit:remote.unit||x.unit,generatedQty,qty:effectiveQty,unitPrice:state.role==='main'?Number(remote.unitPrice||0):0,remoteMissing:!state.remoteByKey[internalKey],isCustom:false};
  });

  // Main-created custom BOM products are Supabase-backed and use their default quantity.
  state.remoteCatalogue.filter(x=>x.isCustom).forEach(x=>{
    const q=x.qtyOverride===null||x.qtyOverride===undefined?0:Number(x.qtyOverride||0);
    if(q>0) rows.push({key:x.internalKey,internalKey:x.internalKey,category:x.category||'Custom',item:x.name||'Custom Item',unit:x.unit||'pcs',generatedQty:q,qty:q,unitPrice:state.role==='main'?Number(x.unitPrice||0):0,remoteMissing:false,isCustom:true});
  });
  return {basis,exact:l===24&&w===24&&h===8,rows};
}

function rowDisplayName(r){
  if(r.isCustom)return r.item;
  const thick=thicknessLabel(r.key);
  if(thick)return `${thick} — ${r.item}`;
  if(r.key==='partition'&&document.getElementById('partitionRequired')?.value==='yes')return `${document.getElementById('partitionType')?.value||'Internal panel partition'} — ${num('partitionLength')} ft × ${num('partitionWidth')} ft`;
  return r.item;
}

function generateAiBom(){
  if(!requireCustomerProject())return;
  if(state.role!=='main')return;
  const l=num('len'),w=num('wid'),h=num('hei');
  let bom=buildBom(l,w,h);
  const levels=activeWallLevels(h);

  // Hard wall-level constraints: inactive levels can never be created.
  [['wallL1','l1'],['wallL2','l2'],['wallL3','l3'],['wallL4','l4']].forEach(([rowKey,levelKey])=>{
    const row=bom.rows.find(x=>x.key===rowKey);
    if(row && !levels[levelKey]){row.generatedQty=0;row.qty=0;row.removed=true}
  });

  // AI-assisted gap suggestions only. Verified/generated rows remain authoritative.
  const addSuggested=(name,qty,unit,category,priceKey=null)=>{
    if(!(qty>0))return;
    const internalKey=priceKey||('ai_'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
    const remote=state.remoteByKey[internalKey]||{};
    bom.rows.push({
      key:internalKey,internalKey,category,item:remote.name||name,unit,
      generatedQty:qty,qty,unitPrice:Number(remote.unitPrice||0),
      remoteMissing:!state.remoteByKey[internalKey],isCustom:true,aiSuggested:true
    });
  };

  // Partition-specific suggestions.
  if(document.getElementById('partitionRequired')?.value==='yes'){
    const plen=num('partitionLength'),pheight=num('partitionWidth'),pqty=Math.max(1,num('partitionQty'));
    if(plen>0 && pheight>0){
      const panelQty=Math.ceil(plen/4)*Math.ceil(pheight/4)*pqty;
      addSuggested('Partition Panel',panelQty,'pcs','Partition');
      addSuggested('Partition Cleat',Math.max(2,Math.ceil(plen/4)*2*pqty),'pcs','Partition');
      addSuggested('Partition Angle Stay',Math.max(2,Math.ceil(pheight/4)*2*pqty),'pcs','Partition','stay_partition');
    }
  }

  // Add gap suggestions only when a common active item is missing.
  const activeKeys=new Set(bom.rows.filter(r=>r.qty>0&&!r.removed).map(r=>r.key));
  if(document.getElementById('ladder')?.value==='yes' && !activeKeys.has('ladderBracket')){
    addSuggested('Ladder Brackets',Math.max(2,Math.ceil(h/4)*3),'pcs','Accessories','ladder_bracket');
  }
  if(document.getElementById('vent')?.value==='yes' && !activeKeys.has('airVent')){
    addSuggested('Air Vent',1,'pcs','Accessories','air_vent');
  }
  if(document.getElementById('level')?.value==='yes' && !activeKeys.has('levelIndicator')){
    addSuggested('Water Level Indicator',h,'ft','Accessories','quick_wli_ft');
  }

  state.currentBom=bom;
  renderBomTableOnly(bom);
  recalcMainManualBom();
  bomMethod.textContent='AI-assisted BOM generated. Verified/formula rows are retained; AI Suggested rows are additions for Main review.';
}

function addCurrentBomItem(){
  if(state.role!=='main'||!state.currentBom)return;
  const name=prompt('Item name:','Additional Item');if(!name)return;
  const qty=Math.max(0,Number(prompt('Quantity:','1'))||0);if(qty<=0)return;

function recalcMainManualBom(){
  if(state.role!=='main'||!state.currentBom)return null;
  const tankQty=Math.max(1,num('qty'));
  const material=state.currentBom.rows.reduce((a,r)=>a+(Number(r.qty)||0)*(Number(r.unitPrice)||0),0)*tankQty;
  const wasteRate=Number(state.settings.waste||0),wasteAmount=material*wasteRate/100;
  const fabrication=Number(state.settings.fabrication||0)*tankQty;
  const installation=Number(state.settings.installation||0)*tankQty;
  const transport=Number(state.settings.transport||state.settings.delivery||0)*tankQty;
  const other=Number(state.settings.other||0)*tankQty;
  const costBeforeSelling=material+wasteAmount+fabrication+installation+transport+other;
  const overheadRate=Number(state.settings.overhead||0),overheadAmount=costBeforeSelling*overheadRate/100;
  const profitMarginRate=Number(state.settings.profitMargin||0),profitAmount=(costBeforeSelling+overheadAmount)*profitMarginRate/100;
  const discount=Number(state.settings.discount||0)*tankQty;
  const subtotal=Math.max(0,costBeforeSelling+overheadAmount+profitAmount-discount);
  const sstRate=document.getElementById('sstOn')?.value==='yes'?Number(state.settings.sst||0):0;
  const taxAmount=subtotal*sstRate/100;
  const finalTotal=Math.round((subtotal+taxAmount+Number.EPSILON)*100)/100;
  state.currentManualTotals={material,wasteRate,wasteAmount,fabrication,installation,transport,other,costBeforeSelling,overheadRate,overheadAmount,profitMarginRate,profitAmount,discount,subtotal,sstRate,taxAmount,finalTotal,currency:'MYR'};
  if(document.getElementById('sellPrice'))sellPrice.textContent=money(finalTotal);
  if(document.getElementById('mobileSellPrice'))mobileSellPrice.textContent=money(finalTotal);
  if(document.getElementById('taxLine'))taxLine.textContent=sstRate?`Includes ${sstRate}% SST`:'SST excluded';
  if(document.getElementById('mainBreakdown'))mainBreakdown.innerHTML=
    `<b>Fixed default costs included for every tank</b><br><br>`+
    `Material: <b>${money(material)}</b><br>`+
    `Waste ${wasteRate}%: <b>${money(wasteAmount)}</b><br>`+
    `Fabrication Labour: <b>${money(fabrication)}</b><br>`+
    `Installation: <b>${money(installation)}</b><br>`+
    `Transport / Crane: <b>${money(transport)}</b><br>`+
    `Other Cost: <b>${money(other)}</b><br>`+
    `Overhead ${overheadRate}%: <b>${money(overheadAmount)}</b><br>`+
    `Profit Margin ${profitMarginRate}%: <b>${money(profitAmount)}</b><br>`+
    `Discount: <b>-${money(discount)}</b><br>`+
    `Before SST: <b>${money(subtotal)}</b><br>`+
    `SST ${sstRate}%: <b>${money(taxAmount)}</b>`;
  return state.currentManualTotals;
}

function validateCustomerProject(showErrors=true){
  const c=document.getElementById('customer'),p=document.getElementById('project');
  const cv=(c?.value||'').trim(),pv=(p?.value||'').trim();
  const cOk=!!cv,pOk=!!pv;
  if(c){
    c.classList.toggle('invalid',!cOk&&showErrors);
    c.classList.toggle('valid',cOk);
  }
  if(p){
    p.classList.toggle('invalid',!pOk&&showErrors);
    p.classList.toggle('valid',pOk);
  }
  document.getElementById('customerError')?.classList.toggle('hidden',cOk||!showErrors);
  document.getElementById('projectError')?.classList.toggle('hidden',pOk||!showErrors);

  document.querySelectorAll('[data-requires-project="1"]').forEach(btn=>{
    btn.disabled=!(cOk&&pOk);
    btn.classList.toggle('disabledAction',!(cOk&&pOk));
  });

  const gate=document.getElementById('requiredGate');
  if(gate){
    gate.classList.toggle('ready',cOk&&pOk);
    gate.innerHTML=cOk&&pOk
      ? '<b>Ready</b><span>Customer and project confirmed.</span>'
      : '<b>Required</b><span>Enter Customer and Project to continue.</span>';
  }
  return cOk&&pOk;
}
function requireCustomerProject(){

function calc(){

  syncWallLevelUi();syncPartitionUi();
  const l=num('len'),w=num('wid'),h=num('hei'),q=Math.max(1,num('qty')),bom=renderBom(l,w,h);

let priceTimer=null;
function scheduleRemotePrice(bom,q){
  clearTimeout(priceTimer);const seq=++state.priceSeq;priceTimer=setTimeout(()=>remotePrice(bom,q,seq),180);
}
async function remotePrice(bom,q,seq=++state.priceSeq){
  try{
    const r=await pricingApi('quick_price',{
      rows:bom.rows.filter(x=>x.generatedQty>0||x.qty>0).map(x=>({internalKey:x.internalKey,quantity:x.generatedQty})),
      tankQty:q,
      includeTax:document.getElementById('sstOn')?.value==='yes'
    });
    if(seq!==state.priceSeq)return r;
    state.lastPrice=r;const t=r.totals||{};
    sellPrice.textContent=money(t.finalTotal||0);
    if(document.getElementById('mobileSellPrice'))mobileSellPrice.textContent=money(t.finalTotal||0);
    taxLine.textContent=t.sstRate?`Includes ${Number(t.sstRate)}% SST`:'SST excluded';
    if(state.role==='main'&&document.getElementById('mainBreakdown'))mainBreakdown.innerHTML=
      `<b>Fixed default costs included for every tank</b><br><br>`+
      `Material: <b>${money(t.material||0)}</b><br>`+
      `Waste ${Number(t.wasteRate||0)}%: <b>${money(t.wasteAmount||0)}</b><br>`+
      `Fabrication Labour: <b>${money(t.fabrication||0)}</b><br>`+
      `Installation: <b>${money(t.installation||0)}</b><br>`+
      `Transport / Crane: <b>${money(t.transport||0)}</b><br>`+
      `Other Cost: <b>${money(t.other||0)}</b><br>`+
      `Overhead ${Number(t.overheadRate||0)}%: <b>${money(t.overheadAmount||0)}</b><br>`+
      `Profit Margin ${Number(t.profitMarginRate||0)}%: <b>${money(t.profitAmount||0)}</b><br>`+
      `Discount: <b>-${money(t.discount||0)}</b><br>`+
      `Before SST: <b>${money(t.subtotal||0)}</b><br>`+
      `SST ${Number(t.sstRate||0)}%: <b>${money(t.taxAmount||0)}</b>`;
    const qmap=Object.fromEntries((r.rows||[]).map(x=>[x.internalKey,Number(x.quantity||0)]));
    bom.rows.forEach(x=>{
      if(Number(x.generatedQty||0)<=0 && !x.isCustom){x.qty=0;return}
      if(qmap[x.internalKey]!==undefined)x.qty=qmap[x.internalKey];
    });
    renderBomTableOnly(bom);
    return r;
  }catch(e){
    if(seq!==state.priceSeq)return null;
    sellPrice.textContent='Sync error';
    if(document.getElementById('mobileSellPrice'))mobileSellPrice.textContent='Sync error';
    taxLine.textContent=e.message||'Unable to calculate from Supabase';
    return null
  }
}

      <button class="btn primary" data-requires-project="1" onclick="runAiCommand()">Run AI Command</button>
      <button class="btn" onclick="setView('calculator')">Back to Calculator</button>
    </div>
    <div id="aiResult" class="aiResult">${hasBom?'Current calculator BOM is available for analysis.':'Open Quick Calculator and enter a tank size first.'}</div>
  </div>`;
}
function runAiPreset(type){
  const map={
    generate:'Generate BOM for the current tank and show what you changed.',
    check:'Check the current BOM for missing or invalid items.',
    fix:'Fix missing BOM items for the current tank but do not save anything.',
    price:'Estimate the current selling price and explain the cost build-up.',
    compare:'Compare the current BOM with the latest saved sales quote.',
    explain:'Explain the current BOM quantities and wall levels.'
  };
  const el=document.getElementById('aiCommand');if(el)el.value=map[type]||'';
  runAiCommand();
}
function ensureCurrentBom(){
  const l=num('len'),w=num('wid'),h=num('hei');
  if(!(l>0&&w>0&&h>0))return null;
  let bom=buildBom(l,w,h);
  const levels=activeWallLevels(h);
  [['wallL1','l1'],['wallL2','l2'],['wallL3','l3'],['wallL4','l4']].forEach(([rowKey,levelKey])=>{
    const row=bom.rows.find(x=>x.key===rowKey);
    if(row&&!levels[levelKey]){row.generatedQty=0;row.qty=0;row.removed=true}
  });
  return bom;
}
function aiBomIssues(bom){
  const issues=[];
  const h=num('hei'),levels=activeWallLevels(h);
  for(const [key,level] of [['wallL1','l1'],['wallL2','l2'],['wallL3','l3'],['wallL4','l4']]){
    const r=bom.rows.find(x=>x.key===key);
    if(r&&r.qty>0&&!levels[level])issues.push(`${key.toUpperCase()} is active although tank height is ${h} ft.`);
  }
  const active=bom.rows.filter(r=>r.qty>0&&!r.removed);
  if(!active.find(r=>r.key==='manhole'))issues.push('Manhole is missing.');
  if(document.getElementById('vent')?.value==='yes'&&!active.find(r=>r.key==='airVent'))issues.push('Air vent selected but missing from BOM.');
  if(document.getElementById('level')?.value==='yes'&&!active.find(r=>r.key==='levelIndicator'))issues.push('Water level indicator selected but missing from BOM.');
  if(document.getElementById('partitionRequired')?.value==='yes'&&!active.find(r=>r.key==='partition'))issues.push('Partition selected but base partition line is missing.');
  active.filter(r=>Number(r.unitPrice||0)<=0).forEach(r=>issues.push(`${rowDisplayName(r)} has no unit price.`));
  return issues;
}
function aiAddGapSuggestions(bom){
  const before=bom.rows.filter(r=>r.qty>0&&!r.removed).length;
  state.currentBom=bom;
  generateAiBom();
  bom=state.currentBom;
  const after=bom.rows.filter(r=>r.qty>0&&!r.removed).length;
  return {bom,added:Math.max(0,after-before)};
}
function aiPriceSummary(bom){
  state.currentBom=bom;
  const t=recalcMainManualBom();
  if(!t)return 'Unable to calculate price.';
  return `Material ${money(t.material)}; waste ${t.wasteRate}% = ${money(t.wasteAmount)}; fabrication ${money(t.fabrication)}; installation ${money(t.installation)}; transport/crane ${money(t.transport)}; other ${money(t.other)}; overhead ${t.overheadRate}% = ${money(t.overheadAmount)}; profit ${t.profitMarginRate}% = ${money(t.profitAmount)}; discount ${money(t.discount)}; SST ${t.sstRate}% = ${money(t.taxAmount)}; final ${money(t.finalTotal)}.`;
}
async function aiLatestQuoteCompare(bom){
  try{
    const r=await quotesApi('quotes_list'),quotes=r.quotes||[];
    if(!quotes.length)return 'No saved sales quote is available for comparison.';
    const q=quotes[0],cur=Object.fromEntries(bom.rows.filter(x=>x.qty>0&&!x.removed).map(x=>[x.internalKey,Number(x.qty||0)]));
    const old=Object.fromEntries((q.bom||[]).map(x=>[x.internalKey||x.name,Number(x.quantity||0)]));
    const changes=[];
    for(const x of bom.rows.filter(x=>x.qty>0&&!x.removed)){
      const oldQty=old[x.internalKey];
      if(oldQty===undefined)changes.push(`Added: ${rowDisplayName(x)} × ${x.qty}`);
      else if(oldQty!==Number(x.qty||0))changes.push(`Changed: ${rowDisplayName(x)} ${oldQty} → ${x.qty}`);
    }
    return `Compared with latest quote ${q.customer||''} ${q.project||''}. ${changes.length?changes.join(' • '):'No obvious BOM quantity changes found.'}`;
  }catch(e){return e.message||'Unable to compare latest quote.'}
}
async function runAiCommand(){
  if(!requireCustomerProject())return;
  recordActivity('ai_command',{command:(document.getElementById('aiCommand')?.value||'').slice(0,120)});
  if(state.role!=='main')return;
  const out=document.getElementById('aiResult');
  if(out)out.innerHTML='<span class="muted">Analyzing…</span>';
  const cmd=(document.getElementById('aiCommand')?.value||'').toLowerCase();
  let bom=ensureCurrentBom();
  if(!bom){
    if(out)out.textContent='Enter a valid tank Length × Width × Height in Quick Calculator first.';
    return;
  }
  const notes=[];
  if(cmd.includes('generate')){
    state.currentBom=bom;generateAiBom();bom=state.currentBom;notes.push('Generated the BOM from the current tank configuration.');
  }
  if(cmd.includes('fix')||cmd.includes('missing')){
    const result=aiAddGapSuggestions(bom);bom=result.bom;notes.push(`Added ${result.added} suggested BOM item(s) for Main review.`);
  }
  if(cmd.includes('check')){
    const issues=aiBomIssues(bom);
    notes.push(issues.length?`BOM check found ${issues.length} issue(s): ${issues.join(' • ')}`:'BOM check found no obvious rule or price issue.');
  }
  if(cmd.includes('price')||cmd.includes('estimate')){
    notes.push(aiPriceSummary(bom));
  }
  if(cmd.includes('compare')){
    notes.push(await aiLatestQuoteCompare(bom));
  }
  if(cmd.includes('explain')){
    const h=num('hei'),levels=activeWallLevels(h),wall=['L1','L2','L3','L4'].filter((x,i)=>[levels.l1,levels.l2,levels.l3,levels.l4][i]);
    notes.push(`Tank height ${h} ft activates ${wall.join(' + ')} only. Active BOM has ${bom.rows.filter(x=>x.qty>0&&!x.removed).length} lines. Inactive wall levels are forced to zero.`);
  }
  if(!notes.length){
    notes.push('Command understood as a general BOM review. '+(aiBomIssues(bom).length?aiBomIssues(bom).join(' • '):'No obvious issue found.'));
  }
  state.currentBom=bom;
  if(out)out.innerHTML=`<b>AI Result</b><div style="margin-top:8px">${notes.map(esc).join('<br><br>')}</div><div class="toolbar" style="margin-top:12px"><button class="btn primary" onclick="applyAiBomToCalculator()">Use This BOM</button><button class="btn" onclick="setView('calculator')">Review Calculator</button></div>`;
}
function applyAiBomToCalculator(){
  if(!state.currentBom)return;
  setView('calculator');
  setTimeout(()=>{renderBomTableOnly(state.currentBom);recalcMainManualBom();if(document.getElementById('bomMethod'))bomMethod.textContent='AI-assisted BOM applied for Main review. Not saved until you save the quote/defaults.'},0);
}

function activityLabel(action){
