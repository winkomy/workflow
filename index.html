<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WINKO Quick Sales Calculator</title>
<style>
:root{--navy:#17324d;--blue:#2f5d7c;--bg:#f6f8fb;--text:#1f2937;--muted:#6b7280;--border:#d8e0e7;--white:#fff;--green:#e8f5ea;--greenT:#27623a;--amber:#fff4cf;--amberT:#805d00}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#eef3f7}.loginCard{width:min(420px,100%);background:#fff;border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 18px 50px rgba(23,50,77,.12)}
.loginCard h1{margin:0;color:var(--navy);font-size:24px}.loginCard p{margin:6px 0 18px;color:var(--muted);font-size:13px}
.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:11px;font-weight:800;color:#475569}.input,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 11px;background:#fff;color:var(--text)}
.btn{border:1px solid var(--border);background:#fff;padding:9px 12px;border-radius:8px;font-weight:800;cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:20px 14px}.brand{padding:4px 8px 22px}.brand b{display:block;font-size:18px}.brand small{opacity:.72}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dce7f0;padding:11px 12px;text-align:left;border-radius:8px;font-weight:800;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.14);color:#fff}
.main{padding:24px}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:25px}.sub{margin-top:4px;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}.card h2{margin:0 0 14px;font-size:17px;color:var(--navy)}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.kpi{border:1px solid var(--border);border-radius:10px;padding:14px}.kpi span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.kpi b{display:block;font-size:23px;margin-top:6px;color:var(--navy)}
.result{font-size:34px;font-weight:900;color:var(--navy)}.muted{font-size:12px;color:var(--muted)}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--green);color:var(--greenT);font-size:10px;font-weight:900}
.notice{padding:10px 12px;border-radius:8px;background:var(--amber);color:var(--amberT);font-size:12px;margin-bottom:14px;line-height:1.45}
.tableWrap{overflow:auto;border:1px solid var(--border);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:9px 10px;border-bottom:1px solid #edf1f5;text-align:left;font-size:12px;vertical-align:top}th{background:#f1f5f8;color:#456175;font-size:10px;text-transform:uppercase;position:sticky;top:0;z-index:1}
.bomGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.bomCard{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff}.bomCard b{display:block;color:var(--navy);font-size:12px;margin-bottom:6px}.bomCard span{font-size:12px;color:var(--muted)}
.priceInput{min-width:120px}.sectionTitle{font-weight:900;color:var(--navy);margin:16px 0 8px}.bomNote{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.45}
@media(max-width:950px){.app{grid-template-columns:1fr}.nav{grid-template-columns:repeat(3,1fr)}.grid,.formGrid,.kpis,.bomGrid{grid-template-columns:1fr}.full{grid-column:auto}.main{padding:14px}}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="loginCard">
    <h1>WINKO Quick Calculator</h1>
    <p>Sales quick calculator with Main-only BOM price control.</p>
    <div class="field"><label>Username</label><input id="loginUser" class="input"></div>
    <div class="field"><label>Password</label><input id="loginPass" class="input" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn primary" style="width:100%" onclick="doLogin()">Login</button>
    <div id="loginMsg" class="muted" style="margin-top:10px;color:#a12626"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><b>WINKO</b><small>Quick Sales Calculator</small></div>
    <div id="nav" class="nav"></div>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div>
      <div class="toolbar"><span id="roleTag" class="tag"></span><button class="btn" onclick="logout()">Sign out</button></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
const STORAGE='winko_quick_calc_full_bom_v2';
const SESSION='winko_quick_calc_session';

const BOM_CATALOGUE=[
  {key:'manhole',category:'Panels',item:'Manhole',unit:'pcs'},
  {key:'roof15',category:'Panels',item:'1.5mm (Roof)',unit:'pcs'},
  {key:'wallL1',category:'Panels',item:'Wall L1',unit:'pcs'},
  {key:'wallL2',category:'Panels',item:'Wall L2',unit:'pcs'},
  {key:'wallL3',category:'Panels',item:'Wall L3',unit:'pcs'},
  {key:'wallL4',category:'Panels',item:'Wall L4',unit:'pcs'},
  {key:'base50',category:'Panels',item:'5.0mm (Base)',unit:'pcs'},

  {key:'roofTrusses',category:'Cleats / Trusses / Stays',item:'Roof Trusses (12 ft)',unit:'pcs'},
  {key:'roofSupport8',category:'Cleats / Trusses / Stays',item:'8" Roof Support',unit:'pcs'},
  {key:'cleatA',category:'Cleats / Trusses / Stays',item:'Type (A) Cleat',unit:'pcs'},
  {key:'cleatB',category:'Cleats / Trusses / Stays',item:'Type (B) Cleat',unit:'pcs'},
  {key:'cleatC',category:'Cleats / Trusses / Stays',item:'Type (C) Cleat',unit:'pcs'},
  {key:'cleatC1',category:'Cleats / Trusses / Stays',item:'Type (C1) Cleat',unit:'pcs'},
  {key:'ladderBracket',category:'Cleats / Trusses / Stays',item:'Ladder Brackets',unit:'pcs'},
  {key:'angleStay67_5',category:'Cleats / Trusses / Stays',item:'67 1/2" Angle Stay',unit:'pcs'},
  {key:'stay11_3_2',category:'Cleats / Trusses / Stays',item:'11-3/2"',unit:'pcs'},

  {key:'extLadder',category:'Accessories / Fasteners',item:'Ext. Ladder',unit:'ft'},
  {key:'intLadder',category:'Accessories / Fasteners',item:'Int. Ladder',unit:'ft'},
  {key:'airVent',category:'Accessories / Fasteners',item:'Air-Vents',unit:'pcs'},
  {key:'levelIndicator',category:'Accessories / Fasteners',item:'Water Level Indicator',unit:'ft'},
  {key:'m14BN',category:'Accessories / Fasteners',item:'M14x30 BN',unit:'pcs'},
  {key:'m14Washer',category:'Accessories / Fasteners',item:'M14 washer',unit:'pcs'},
  {key:'bnw58',category:'Accessories / Fasteners',item:'5/8 x 1½ BNW',unit:'set'},
  {key:'bn38',category:'Accessories / Fasteners',item:'3/8 x 3/4 BN (set)',unit:'set'},
  {key:'m16x40',category:'Accessories / Fasteners',item:'M16 x40mm B.N.W (set)',unit:'set'},

  {key:'sealant45',category:'Sealants',item:'5x45x10m Sealant Roll',unit:'roll'},
  {key:'sealant40',category:'Sealants',item:'3x40x10m Sealant Roll',unit:'roll'},
  {key:'butyl8',category:'Sealants',item:'8mm Butyl Sealant',unit:'pcs'},
  {key:'butyl24',category:'Sealants',item:'24mm Butyl Sealant',unit:'pcs'}
];

const DEFAULT_PRODUCT_PRICES=Object.fromEntries(BOM_CATALOGUE.map(x=>[x.key,0]));
const DEFAULTS={
  productPrices:DEFAULT_PRODUCT_PRICES,
  deliveryBase:0,
  installationBase:0,
  markup:25,
  sst:8,
  currency:'MYR'
};

const VERIFIED_BOM_24_24_8={
  manhole:1,roof15:35,wallL1:24,wallL2:24,wallL3:0,wallL4:0,base50:36,
  roofTrusses:10,roofSupport8:5,cleatA:8,cleatB:45,cleatC:24,cleatC1:24,
  ladderBracket:6,angleStay67_5:28,stay11_3_2:4,
  extLadder:8,intLadder:8,airVent:1,levelIndicator:8,
  m14BN:2510,m14Washer:2510,bnw58:190,bn38:260,m16x40:380,
  sealant45:24,sealant40:10,butyl8:49,butyl24:45
};

let state={settings:loadSettings(),role:null,view:'calculator'};

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadSettings(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE)||'{}');
    return {...clone(DEFAULTS),...x,productPrices:{...DEFAULT_PRODUCT_PRICES,...(x.productPrices||{})}};
  }catch{return clone(DEFAULTS)}
}
function saveSettings(){localStorage.setItem(STORAGE,JSON.stringify(state.settings))}
function doLogin(){
  const u=loginUser.value.trim().toLowerCase(),p=loginPass.value;
  let role=null;
  if(u==='sales'&&p==='sales123')role='sales';
  if(u==='main'&&p==='main123')role='main';
  if(!role){loginMsg.textContent='Invalid username or password.';return}
  sessionStorage.setItem(SESSION,role);start(role)
}
function start(role){state.role=role;loginScreen.classList.add('hidden');app.classList.remove('hidden');setView('calculator')}
function logout(){sessionStorage.removeItem(SESSION);location.reload()}
function setView(v){state.view=v;renderNav();if(v==='prices')renderPrices();else if(v==='history')renderHistory();else renderCalculator()}
function renderNav(){
  const items=[['calculator','Quick Calculator'],['history','Recent Quotes']];
  if(state.role==='main')items.push(['prices','BOM Price Control']);
  nav.innerHTML=items.map(([k,l])=>`<button class="${state.view===k?'active':''}" onclick="setView('${k}')">${l}</button>`).join('')
}
function page(t,s){pageTitle.textContent=t;pageSub.textContent=s;roleTag.textContent=state.role==='main'?'MAIN CONTROL':'SALES'}
function money(v){return new Intl.NumberFormat('en-MY',{style:'currency',currency:state.settings.currency||'MYR',maximumFractionDigits:2}).format(Number(v||0))}
function num(id){return Number(document.getElementById(id)?.value||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function tankBasis(l,w,h){
  const lp=l/4,wp=w/4,hp=h/4,roof=lp*wp,perimeter=2*(lp+wp),wall=perimeter*hp;
  return {lp,wp,hp,roof,perimeter,wall,total:roof*2+wall};
}
function validGrid(b){return [b.lp,b.wp,b.hp].every(x=>Number.isInteger(x)&&x>=1)}

function originalBom(l,w,h){
  if(l===24&&w===24&&h===8)return clone(VERIFIED_BOM_24_24_8);

  const s=tankBasis(l,w,h),lp=s.lp,wp=s.wp,hp=s.hp;
  const cleatA=Math.max(0,(wp-1)*2);
  const cleatB=Math.ceil(Math.max(0,(lp-1)*(wp-1)))+Math.ceil(Math.max(0,lp-1))*2+Math.ceil(Math.max(0,wp-1))*2;
  const cleatC=Math.ceil(Math.max(0,(lp-1)*2+(wp-1)*2))+Math.ceil(Math.max(0,hp-1))*4;

  const bn58=cleatB*4+(cleatC*2)*2;
  const roofJoint=Math.ceil(lp+1)*wp+Math.ceil(wp+1)*lp;
  const wallJoint=Math.ceil(lp-1)*hp*2+Math.ceil(wp-1)*hp*2;
  const m14=Math.ceil(roofJoint)*17+Math.ceil(wallJoint)*17+hp*4*17;
  const bn38=Math.ceil((lp*Math.ceil(wp+1)+Math.ceil(lp+1)*wp+(lp+wp)*2)*10*1.03);
  const seal45=Math.round(Math.ceil(((hp*Math.ceil(lp-1)+lp*Math.ceil(hp))*2*1.35+((hp*Math.ceil(wp-1)+wp*Math.ceil(hp))*2*1.35))+Math.ceil(roofJoint*1.35)+hp*4*1.22)/10);
  const seal40=Math.ceil(Math.ceil(roofJoint*1.35)/10);

  return {
    manhole:1,
    roof15:Math.max(0,Math.round(lp*wp-1)),
    wallL1:hp>=1?Math.round(s.perimeter):0,
    wallL2:hp>=2?Math.round(s.perimeter):0,
    wallL3:hp>=3?Math.round(s.perimeter):0,
    wallL4:hp>=4?Math.round(s.perimeter):0,
    base50:Math.round(lp*wp),

    roofTrusses:Math.max(0,Math.round(lp-1)),
    roofSupport8:Math.max(0,Math.round((lp+wp)*2)),
    cleatA:Math.round(cleatA),
    cleatB:Math.round(cleatB),
    cleatC:Math.round(cleatC),
    cleatC1:Math.round(cleatC),
    ladderBracket:Math.max(0,Math.round(3*hp)),
    angleStay67_5:Math.max(0,Math.round(Math.ceil(lp-1)*2+Math.ceil(wp-1)*2+hp*4)),
    stay11_3_2:Math.max(0,Math.round(2*hp)),

    extLadder:h,
    intLadder:h,
    airVent:1,
    levelIndicator:h,
    m14BN:Math.round(m14),
    m14Washer:Math.round(m14),
    bnw58:Math.round(bn58),
    bn38:Math.round(bn38),
    m16x40:Math.round(2*bn58),

    sealant45:Math.max(0,seal45),
    sealant40:Math.max(0,seal40),
    butyl8:Math.max(0,Math.round(cleatC*2+1)),
    butyl24:Math.max(0,Math.round(cleatB))
  };
}

function buildBom(l,w,h){
  const basis=tankBasis(l,w,h),qty=originalBom(l,w,h);
  if(document.getElementById('ladder')?.value!=='yes'){qty.extLadder=0;qty.intLadder=0;qty.ladderBracket=0}
  if(document.getElementById('vent')?.value!=='yes')qty.airVent=0;
  if(document.getElementById('level')?.value!=='yes')qty.levelIndicator=0;
  return {basis,exact:l===24&&w===24&&h===8,rows:BOM_CATALOGUE.map(x=>({...x,qty:Number(qty[x.key]||0),unitPrice:Number(state.settings.productPrices[x.key]||0)}))};
}
function bomCost(bom){return bom.rows.reduce((sum,r)=>sum+r.qty*r.unitPrice,0)}

function renderCalculator(){
  page('Quick Calculator','Sales sees the final selling price. Main controls every BOM product price.');
  view.innerHTML=`
  <div class="grid">
    <div class="card">
      <h2>Tank Details</h2>
      <div class="formGrid">
        <div class="field"><label>Length (ft)</label><input id="len" class="input" type="number" min="4" step="4" value="24" oninput="calc()"></div>
        <div class="field"><label>Width (ft)</label><input id="wid" class="input" type="number" min="4" step="4" value="24" oninput="calc()"></div>
        <div class="field"><label>Height (ft)</label><select id="hei" onchange="calc()"><option>4</option><option selected>8</option><option>12</option><option>16</option></select></div>
        <div class="field"><label>Quantity</label><input id="qty" class="input" type="number" min="1" value="1" oninput="calc()"></div>
        <div class="field"><label>Supply Type</label><select id="supply" onchange="calc()"><option value="supply">Supply Only</option><option value="install">Supply + Installation</option></select></div>
        <div class="field"><label>Delivery</label><select id="delivery" onchange="calc()"><option value="no">No</option><option value="yes">Include Delivery</option></select></div>
        <div class="field"><label>Ladder</label><select id="ladder" onchange="calc()"><option value="no">No</option><option value="yes">Yes</option></select></div>
        <div class="field"><label>Air Vent</label><select id="vent" onchange="calc()"><option value="no">No</option><option value="yes">Yes</option></select></div>
        <div class="field"><label>Water Level Indicator</label><select id="level" onchange="calc()"><option value="no">No</option><option value="yes">Yes</option></select></div>
        <div class="field"><label>SST</label><select id="sstOn" onchange="calc()"><option value="yes">Include</option><option value="no">Exclude</option></select></div>
        <div class="field full"><label>Customer / Project</label><input id="customer" class="input" placeholder="Optional"></div>
      </div>
    </div>

    <div class="card">
      <h2>Sales Result</h2>
      <div class="kpis">
        <div class="kpi"><span>Tank Size</span><b id="sizeText">-</b></div>
        <div class="kpi"><span>Total Panels</span><b id="panelText">0</b></div>
        <div class="kpi"><span>Quantity</span><b id="qtyText">1</b></div>
      </div>
      <div class="muted">Estimated Selling Price</div>
      <div id="sellPrice" class="result">RM0.00</div>
      <div id="taxLine" class="muted" style="margin-top:6px"></div>
      ${state.role==='main'?'<div id="mainBreakdown" class="notice" style="margin-top:16px"></div>':''}
      <div class="toolbar" style="margin-top:18px"><button class="btn primary" onclick="saveQuote()">Save Estimate</button><button class="btn" onclick="renderCalculator()">Reset</button></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>BOM</h2>
    <div class="bomGrid">
      <div class="bomCard"><b>Total Steel Panels</b><span id="bomPanels">0</span></div>
      <div class="bomCard"><b>Roof / Base</b><span id="bomRoofBase">-</span></div>
      <div class="bomCard"><b>Wall Panels</b><span id="bomWall">0</span></div>
      <div class="bomCard"><b>Angle Stay</b><span id="bomStay">0</span></div>
    </div>
    <div id="bomDetail" style="margin-top:14px"></div>
    <div id="bomMethod" class="bomNote"></div>
  </div>`;
  calc()
}

function renderBom(l,w,h){
  const bom=buildBom(l,w,h),b=bom.basis;
  if(!validGrid(b)){
    bomPanels.textContent='Invalid';bomRoofBase.textContent='-';bomWall.textContent='-';bomStay.textContent='-';bomDetail.innerHTML='';bomMethod.textContent='Dimensions must use 4 ft panel modules.';return null;
  }
  bomPanels.textContent=Math.round(b.total);
  bomRoofBase.textContent=`Roof ${Math.round(b.roof)} / Base ${Math.round(b.roof)}`;
  bomWall.textContent=Math.round(b.wall);
  bomStay.textContent=bom.rows.find(x=>x.key==='angleStay67_5')?.qty||0;

  bomDetail.innerHTML=`<div class="tableWrap"><table><thead><tr><th>Category</th><th>BOM Product</th><th>Qty</th>${state.role==='main'?'<th>Unit Price</th><th>Amount</th>':''}</tr></thead><tbody>
    ${bom.rows.filter(r=>r.qty>0).map(r=>`<tr><td>${esc(r.category)}</td><td><b>${esc(r.item)}</b></td><td>${r.qty} ${esc(r.unit)}</td>${state.role==='main'?`<td>${money(r.unitPrice)}</td><td><b>${money(r.qty*r.unitPrice)}</b></td>`:''}</tr>`).join('')}
  </tbody></table></div>`;

  bomMethod.textContent=bom.exact
    ? 'Verified 24×24×8 reference BOM is applied.'
    : 'Original Excel-style formulas are used where available; wall panels are split by active 4 ft levels.';
  return bom;
}

function calc(){
  const l=num('len'),w=num('wid'),h=num('hei'),q=Math.max(1,num('qty'));
  const bom=renderBom(l,w,h);
  const perTank=bom?bomCost(bom):0;

  let cost=perTank*q;
  if(document.getElementById('delivery')?.value==='yes')cost+=Number(state.settings.deliveryBase||0)*q;
  if(document.getElementById('supply')?.value==='install')cost+=Number(state.settings.installationBase||0)*q;

  const sell=cost*(1+Number(state.settings.markup||0)/100);
  const tax=document.getElementById('sstOn')?.value==='yes'?sell*(Number(state.settings.sst||0)/100):0;
  const total=sell+tax;

  sizeText.textContent=`${l}' × ${w}' × ${h}'`;
  panelText.textContent=bom?Math.round(bom.basis.total):0;
  qtyText.textContent=q;
  sellPrice.textContent=money(total);
  taxLine.textContent=tax?`Includes ${state.settings.sst}% SST`:'SST excluded';

  if(state.role==='main'&&document.getElementById('mainBreakdown')){
    mainBreakdown.innerHTML=`BOM Cost / Tank: <b>${money(perTank)}</b><br>Total Internal Cost: <b>${money(cost)}</b><br>Markup: <b>${state.settings.markup}%</b><br>Before SST: <b>${money(sell)}</b><br>SST: <b>${money(tax)}</b>`;
  }
  return {l,w,h,q,total,bomCost:perTank}
}

function saveQuote(){
  const r=calc(),arr=JSON.parse(sessionStorage.getItem('winko_calc_history')||'[]');
  arr.unshift({date:new Date().toISOString(),customer:customer.value.trim(),size:`${r.l}' × ${r.w}' × ${r.h}'`,qty:r.q,total:r.total});
  sessionStorage.setItem('winko_calc_history',JSON.stringify(arr.slice(0,30)));
  alert('Estimate saved.')
}

function renderHistory(){
  page('Recent Quotes','Temporary estimates saved in this browser session.');
  let arr=[];try{arr=JSON.parse(sessionStorage.getItem('winko_calc_history')||'[]')}catch{}
  view.innerHTML=`<div class="card"><h2>Recent Estimates</h2>${arr.length?`<div class="tableWrap"><table><thead><tr><th>Date</th><th>Customer / Project</th><th>Tank Size</th><th>Qty</th><th>Selling Price</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${new Date(x.date).toLocaleString()}</td><td>${esc(x.customer||'—')}</td><td>${esc(x.size)}</td><td>${x.qty}</td><td><b>${money(x.total)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">No saved estimates yet.</div>'}</div>`
}

function renderPrices(){
  if(state.role!=='main'){setView('calculator');return}
  page('BOM Product Price Control','Main controls every BOM product unit price and selling rule.');

  view.innerHTML=`<div class="card">
    <h2>Full BOM Product Price Database</h2>
    <div class="notice">Every generated BOM line is priced from this table. Sales users cannot access this page or see these internal prices.</div>
    <div class="toolbar" style="margin-bottom:12px"><input id="priceSearch" class="input" style="max-width:340px" placeholder="Search product or category..." oninput="filterPriceRows()"></div>
    <div class="tableWrap"><table><thead><tr><th>Category</th><th>BOM Product</th><th>Unit</th><th>Unit Price (MYR)</th></tr></thead><tbody>
      ${BOM_CATALOGUE.map(x=>`<tr class="priceRow"><td>${esc(x.category)}</td><td><b>${esc(x.item)}</b></td><td>${esc(x.unit)}</td><td><input id="price_${x.key}" class="input priceInput" type="number" min="0" step="0.01" value="${Number(state.settings.productPrices[x.key]||0).toFixed(2)}"></td></tr>`).join('')}
    </tbody></table></div>

    <div class="sectionTitle">Selling Rules</div>
    <div class="formGrid">
      <div class="field"><label>Delivery Base / Tank (MYR)</label><input id="deliveryBaseP" class="input" type="number" min="0" step="0.01" value="${Number(state.settings.deliveryBase||0)}"></div>
      <div class="field"><label>Installation Base / Tank (MYR)</label><input id="installationBaseP" class="input" type="number" min="0" step="0.01" value="${Number(state.settings.installationBase||0)}"></div>
      <div class="field"><label>Markup %</label><input id="markupP" class="input" type="number" min="0" step="0.01" value="${Number(state.settings.markup||0)}"></div>
      <div class="field"><label>SST %</label><input id="sstP" class="input" type="number" min="0" step="0.01" value="${Number(state.settings.sst||0)}"></div>
    </div>

    <div class="toolbar" style="margin-top:16px"><button class="btn primary" onclick="savePrices()">Save All Prices</button><button class="btn" onclick="resetPrices()">Reset All Prices</button></div>
  </div>`
}
function filterPriceRows(){
  const q=(document.getElementById('priceSearch')?.value||'').toLowerCase();
  document.querySelectorAll('.priceRow').forEach(row=>row.hidden=!!q&&!row.textContent.toLowerCase().includes(q));
}
function savePrices(){
  BOM_CATALOGUE.forEach(x=>state.settings.productPrices[x.key]=Number(document.getElementById('price_'+x.key)?.value||0));
  state.settings.deliveryBase=num('deliveryBaseP');
  state.settings.installationBase=num('installationBaseP');
  state.settings.markup=num('markupP');
  state.settings.sst=num('sstP');
  saveSettings();
  alert('All BOM product prices saved.');
  renderPrices()
}
function resetPrices(){
  if(!confirm('Reset all BOM product prices and selling rules to zero/default values?'))return;
  state.settings=clone(DEFAULTS);
  saveSettings();
  renderPrices()
}

const existing=sessionStorage.getItem(SESSION);
if(existing==='sales'||existing==='main')start(existing);
</script>
</body>
</html>
