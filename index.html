<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WINKO Quick Sales Calculator</title>
<style>
:root{--navy:#17324d;--blue:#2f5d7c;--bg:#f6f8fb;--text:#1f2937;--muted:#6b7280;--border:#d8e0e7;--white:#fff;--green:#e8f5ea;--greenT:#27623a;--amber:#fff4cf;--amberT:#805d00}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#eef3f7}.loginCard{width:min(420px,100%);background:#fff;border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 18px 50px rgba(23,50,77,.12)}
.loginCard h1{margin:0;color:var(--navy);font-size:24px}.loginCard p{margin:6px 0 18px;color:var(--muted);font-size:13px}
.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:11px;font-weight:800;color:#475569}.input,select{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 11px;background:#fff;color:var(--text)}
.btn{border:1px solid var(--border);background:#fff;padding:9px 12px;border-radius:8px;font-weight:800;cursor:pointer}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:20px 14px}.brand{padding:4px 8px 22px}.brand b{display:block;font-size:18px}.brand small{opacity:.72}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dce7f0;padding:11px 12px;text-align:left;border-radius:8px;font-weight:800;cursor:pointer}.nav button.active,.nav button:hover{background:rgba(255,255,255,.14);color:#fff}
.main{padding:24px}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:25px}.sub{margin-top:4px;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}.card h2{margin:0 0 14px;font-size:17px;color:var(--navy)}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.kpi{border:1px solid var(--border);border-radius:10px;padding:14px}.kpi span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.kpi b{display:block;font-size:23px;margin-top:6px;color:var(--navy)}
.result{font-size:34px;font-weight:900;color:var(--navy)}.muted{font-size:12px;color:var(--muted)}.tag{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--green);color:var(--greenT);font-size:10px;font-weight:900}
.notice{padding:10px 12px;border-radius:8px;background:var(--amber);color:var(--amberT);font-size:12px;margin-bottom:14px;line-height:1.45}
.tableWrap{overflow:auto;border:1px solid var(--border);border-radius:9px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:9px 10px;border-bottom:1px solid #edf1f5;text-align:left;font-size:12px;vertical-align:top}th{background:#f1f5f8;color:#456175;font-size:10px;text-transform:uppercase;position:sticky;top:0;z-index:1}
.bomGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.bomCard{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff}.bomCard b{display:block;color:var(--navy);font-size:12px;margin-bottom:6px}.bomCard span{font-size:12px;color:var(--muted)}
.priceInput{min-width:120px}.sectionTitle{font-weight:900;color:var(--navy);margin:16px 0 8px}.bomNote{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.45}
@media(max-width:950px){.app{grid-template-columns:1fr}.nav{grid-template-columns:repeat(3,1fr)}.grid,.formGrid,.kpis,.bomGrid{grid-template-columns:1fr}.full{grid-column:auto}.main{padding:14px}}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="loginCard">
    <h1>WINKO Quick Calculator</h1>
    <p>Supabase-synced sales calculator with Main-only BOM control.</p>
    <div class="field"><label>Username</label><input id="loginUser" class="input"></div>
    <div class="field"><label>Password</label><input id="loginPass" class="input" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn primary" style="width:100%" onclick="doLogin()">Login</button>
    <div id="loginMsg" class="muted" style="margin-top:10px;color:#a12626"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><b>WINKO</b><small>Quick Sales Calculator</small></div>
    <div id="nav" class="nav"></div>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1 id="pageTitle"></h1><div id="pageSub" class="sub"></div></div>
      <div class="toolbar"><span id="roleTag" class="tag"></span><button class="btn" onclick="logout()">Sign out</button></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
const SESSION='winko_quick_calc_session';
const API_URL='https://yzequtnkzuyayydpqayf.supabase.co/functions/v1/factory-simple-api';

const BOM_CATALOGUE=[
  {key:'manhole',category:'Panels',item:'Manhole',unit:'pcs'},
  {key:'roof15',category:'Panels',item:'Roof Panel',unit:'pcs'},
  {key:'wallL1',category:'Panels',item:'Wall L1',unit:'pcs'},
  {key:'wallL2',category:'Panels',item:'Wall L2',unit:'pcs'},
  {key:'wallL3',category:'Panels',item:'Wall L3',unit:'pcs'},
  {key:'wallL4',category:'Panels',item:'Wall L4',unit:'pcs'},
  {key:'base50',category:'Panels',item:'Base Panel',unit:'pcs'},
  {key:'partition',category:'Panels',item:'Internal Partition',unit:'set'},
  {key:'roofTrusses',category:'Cleats / Trusses / Stays',item:'Roof Trusses (12 ft)',unit:'pcs'},
  {key:'roofSupport8',category:'Cleats / Trusses / Stays',item:'8 inch Roof Support',unit:'pcs'},
  {key:'cleatA',category:'Cleats / Trusses / Stays',item:'Type (A) Cleat',unit:'pcs'},
  {key:'cleatB',category:'Cleats / Trusses / Stays',item:'Type (B) Cleat',unit:'pcs'},
  {key:'cleatC',category:'Cleats / Trusses / Stays',item:'Type (C) Cleat',unit:'pcs'},
  {key:'cleatC1',category:'Cleats / Trusses / Stays',item:'Type (C1) Cleat',unit:'pcs'},
  {key:'ladderBracket',category:'Cleats / Trusses / Stays',item:'Ladder Brackets',unit:'pcs'},
  {key:'angleStay67_5',category:'Cleats / Trusses / Stays',item:'67 1/2 inch Angle Stay',unit:'pcs'},
  {key:'stay11_3_2',category:'Cleats / Trusses / Stays',item:'11-3/2 inch Stay',unit:'pcs'},
  {key:'extLadder',category:'Accessories / Fasteners',item:'External Ladder',unit:'ft'},
  {key:'intLadder',category:'Accessories / Fasteners',item:'Internal Ladder',unit:'ft'},
  {key:'airVent',category:'Accessories / Fasteners',item:'Air Vent',unit:'pcs'},
  {key:'levelIndicator',category:'Accessories / Fasteners',item:'Water Level Indicator',unit:'ft'},
  {key:'m14BN',category:'Accessories / Fasteners',item:'M14 x 30 Bolt and Nut',unit:'pcs'},
  {key:'m14Washer',category:'Accessories / Fasteners',item:'M14 Washer',unit:'pcs'},
  {key:'bnw58',category:'Accessories / Fasteners',item:'5/8 x 1 1/2 BNW',unit:'set'},
  {key:'bn38',category:'Accessories / Fasteners',item:'3/8 x 3/4 BNW Set',unit:'set'},
  {key:'m16x40',category:'Accessories / Fasteners',item:'M16 x 40mm B.N.W Set',unit:'set'},
  {key:'sealant45',category:'Sealants',item:'5 x 45 x 10 m Sealant Roll',unit:'roll'},
  {key:'sealant40',category:'Sealants',item:'3 x 40 x 10 m Sealant Roll',unit:'roll'},
  {key:'butyl8',category:'Sealants',item:'8mm Butyl Sealant',unit:'pcs'},
  {key:'butyl24',category:'Sealants',item:'24mm Butyl Sealant',unit:'pcs'}
];

const DEFAULTS={sst:8,markup:25,installation:0,delivery:0,other:0,currency:'MYR'};
const PRODUCT_KEY_MAP={
  manhole:'panel_manhole',partition:'quick_partition',
  roofTrusses:'quick_roof_truss_12ft',roofSupport8:'quick_roof_support_8in',
  cleatA:'cleat_rc_a',cleatB:'cleat_mc_b',cleatC:'cleat_sc_c',cleatC1:'cleat_sc1_c1',
  ladderBracket:'ladder_bracket',angleStay67_5:'stay_67_5',stay11_3_2:'quick_stay_11_3_2',
  extLadder:'quick_ext_ladder_ft',intLadder:'quick_int_ladder_ft',airVent:'air_vent',
  levelIndicator:'quick_wli_ft',m14BN:'bolt_m14x30_bn',m14Washer:'washer_m14',
  bnw58:'quick_bnw_5_8x1_5',bn38:'quick_bnw_3_8x3_4',m16x40:'quick_m16x40_bnw',
  sealant45:'sealant_roll_5x45x10m',sealant40:'sealant_roll_3x40x10m',
  butyl8:'quick_butyl_8mm_piece',butyl24:'quick_butyl_24mm_piece'
};
const VERIFIED_BOM_24_24_8={
  manhole:1,roof15:35,wallL1:24,wallL2:24,wallL3:0,wallL4:0,base50:36,partition:0,
  roofTrusses:10,roofSupport8:5,cleatA:8,cleatB:45,cleatC:24,cleatC1:24,
  ladderBracket:6,angleStay67_5:28,stay11_3_2:4,extLadder:8,intLadder:8,airVent:1,levelIndicator:8,
  m14BN:2510,m14Washer:2510,bnw58:190,bn38:260,m16x40:380,sealant45:24,sealant40:10,butyl8:49,butyl24:45
};

let auth={username:'',password:''};
let state={settings:{...DEFAULTS},role:null,view:'calculator',remoteCatalogue:[],remoteByKey:{},lastPrice:null,priceSeq:0,currentBom:null,currentManualTotals:null,sharedQuotes:[]};

function clone(x){return JSON.parse(JSON.stringify(x))}
async function api(action,data=null){
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:auth.username,password:auth.password,action,data})});
  let body={};try{body=await res.json()}catch{}
  if(!res.ok||body.ok===false)throw new Error(body.error||`Supabase request failed (${res.status})`);
  return body;
}
async function loadRemoteConfig(){
  const r=await api('quick_load');
  state.role=r.role||state.role;
  state.settings={...DEFAULTS,...(r.defaults||{})};
  state.remoteCatalogue=Array.isArray(r.catalogue)?r.catalogue:[];
  state.remoteByKey=Object.fromEntries(state.remoteCatalogue.map(x=>[x.internalKey,x]));
  return r;
}
function thicknessKey(prefix,mm){
  const n=Number(mm||0);
  if(!Number.isFinite(n)||n<=0)return '';
  return `panel_${prefix}_${n.toFixed(1).replace('.','_')}`;
}
function resolvedInternalKey(localKey){
  if(localKey==='roof15')return thicknessKey('roof',num('roofThickness'));
  if(['wallL1','wallL2','wallL3','wallL4'].includes(localKey)){
    const id=localKey==='wallL1'?'wallL1Thickness':localKey==='wallL2'?'wallL2Thickness':localKey==='wallL3'?'wallL3Thickness':'wallL4Thickness';
    return thicknessKey('wall',num(id));
  }
  if(localKey==='base50')return thicknessKey('base',num('baseThickness'));
  return PRODUCT_KEY_MAP[localKey]||localKey;
}
async function doLogin(){
  loginMsg.textContent='Signing in…';
  const u=loginUser.value.trim().toLowerCase(),p=loginPass.value;
  if(!u||!p){loginMsg.textContent='Username and password required.';return}
  try{
    auth={username:u,password:p};
    const r=await api('login');
    state.role=r.role;
    await loadRemoteConfig();
    sessionStorage.setItem(SESSION,JSON.stringify({username:u,role:state.role}));
    loginMsg.textContent='';
    start(state.role);
  }catch(e){auth={username:'',password:''};loginMsg.textContent=e.message||'Login failed.'}
}
function start(role){state.role=role;loginScreen.classList.add('hidden');app.classList.remove('hidden');setView('calculator')}
function logout(){sessionStorage.removeItem(SESSION);auth={username:'',password:''};location.reload()}
function setView(v){state.view=v;renderNav();if(v==='prices')renderPrices();else if(v==='history')renderHistory();else renderCalculator()}
function renderNav(){
  const items=[['calculator','Quick Calculator'],['history','Recent Quotes']];
  if(state.role==='main')items.push(['prices','BOM Price Control']);
  nav.innerHTML=items.map(([k,l])=>`<button class="${state.view===k?'active':''}" onclick="setView('${k}')">${l}</button>`).join('')
}
function page(t,s){pageTitle.textContent=t;pageSub.textContent=s;roleTag.textContent=state.role==='main'?'MAIN CONTROL':'SALES'}
function money(v){return new Intl.NumberFormat('en-MY',{style:'currency',currency:state.settings.currency||'MYR',maximumFractionDigits:2}).format(Number(v||0))}
function num(id){return Number(document.getElementById(id)?.value||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}


function activeWallLevels(heightFt){
  const h=Math.max(Number(heightFt)||0,0);
  return {l1:h>0,l2:h>4,l3:h>8,l4:h>12,count:h<=0?0:Math.min(Math.ceil(h/4),4),overMax:h>16};
}
function syncWallLevelUi(){
  const h=num('hei'),lv=activeWallLevels(h);
  [['wallL1Field','l1'],['wallL2Field','l2'],['wallL3Field','l3'],['wallL4Field','l4']].forEach(([id,k])=>{
    const el=document.getElementById(id);if(el)el.style.display=lv[k]?'grid':'none';
  });
}
function syncPartitionUi(){
  const on=document.getElementById('partitionRequired')?.value==='yes';
  ['partitionTypeField','partitionLengthField','partitionWidthField','partitionQtyField'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.style.display=on?'grid':'none';
  });
}
function thicknessLabel(key){
  const map={
    roof15:['roofThickness','Roof'],
    wallL1:['wallL1Thickness','Wall L1'],
    wallL2:['wallL2Thickness','Wall L2'],
    wallL3:['wallL3Thickness','Wall L3'],
    wallL4:['wallL4Thickness','Wall L4'],
    base50:['baseThickness','Base']
  };
  if(!map[key])return null;
  const [id,label]=map[key],v=Number(document.getElementById(id)?.value||0);
  return `${v.toFixed(1)}mm (${label})`;
}

function tankBasis(l,w,h){
  const lp=l/4,wp=w/4,hp=h/4,roof=lp*wp,perimeter=2*(lp+wp),wall=perimeter*hp;
  return {lp,wp,hp,roof,perimeter,wall,total:roof*2+wall};
}
function validGrid(b){return [b.lp,b.wp,b.hp].every(x=>Number.isInteger(x)&&x>=1)}

function originalBom(l,w,h){
  if(l===24&&w===24&&h===8)return clone(VERIFIED_BOM_24_24_8);

  const s=tankBasis(l,w,h),lp=s.lp,wp=s.wp,hp=s.hp;
  const cleatA=Math.max(0,(wp-1)*2);
  const cleatB=Math.ceil(Math.max(0,(lp-1)*(wp-1)))+Math.ceil(Math.max(0,lp-1))*2+Math.ceil(Math.max(0,wp-1))*2;
  const cleatC=Math.ceil(Math.max(0,(lp-1)*2+(wp-1)*2))+Math.ceil(Math.max(0,hp-1))*4;

  const bn58=cleatB*4+(cleatC*2)*2;
  const roofJoint=Math.ceil(lp+1)*wp+Math.ceil(wp+1)*lp;
  const wallJoint=Math.ceil(lp-1)*hp*2+Math.ceil(wp-1)*hp*2;
  const m14=Math.ceil(roofJoint)*17+Math.ceil(wallJoint)*17+hp*4*17;
  const bn38=Math.ceil((lp*Math.ceil(wp+1)+Math.ceil(lp+1)*wp+(lp+wp)*2)*10*1.03);
  const seal45=Math.round(Math.ceil(((hp*Math.ceil(lp-1)+lp*Math.ceil(hp))*2*1.35+((hp*Math.ceil(wp-1)+wp*Math.ceil(hp))*2*1.35))+Math.ceil(roofJoint*1.35)+hp*4*1.22)/10);
  const seal40=Math.ceil(Math.ceil(roofJoint*1.35)/10);

  return {
    manhole:1,
    roof15:Math.max(0,Math.round(lp*wp-1)),
    wallL1:hp>=1?Math.round(s.perimeter):0,
    wallL2:hp>=2?Math.round(s.perimeter):0,
    wallL3:hp>=3?Math.round(s.perimeter):0,
    wallL4:hp>=4?Math.round(s.perimeter):0,
    base50:Math.round(lp*wp),

    roofTrusses:Math.max(0,Math.round(lp-1)),
    roofSupport8:Math.max(0,Math.round((lp+wp)*2)),
    cleatA:Math.round(cleatA),
    cleatB:Math.round(cleatB),
    cleatC:Math.round(cleatC),
    cleatC1:Math.round(cleatC),
    ladderBracket:Math.max(0,Math.round(3*hp)),
    angleStay67_5:Math.max(0,Math.round(Math.ceil(lp-1)*2+Math.ceil(wp-1)*2+hp*4)),
    stay11_3_2:Math.max(0,Math.round(2*hp)),

    extLadder:h,
    intLadder:h,
    airVent:1,
    levelIndicator:h,
    m14BN:Math.round(m14),
    m14Washer:Math.round(m14),
    bnw58:Math.round(bn58),
    bn38:Math.round(bn38),
    m16x40:Math.round(2*bn58),

    sealant45:Math.max(0,seal45),
    sealant40:Math.max(0,seal40),
    butyl8:Math.max(0,Math.round(cleatC*2+1)),
    butyl24:Math.max(0,Math.round(cleatB))
  };
}

function buildBom(l,w,h){
  const basis=tankBasis(l,w,h),qty=originalBom(l,w,h);
  if(document.getElementById('ladder')?.value!=='yes'){qty.extLadder=0;qty.intLadder=0;qty.ladderBracket=0}
  if(document.getElementById('vent')?.value!=='yes')qty.airVent=0;
  if(document.getElementById('level')?.value!=='yes')qty.levelIndicator=0;
  qty.partition=document.getElementById('partitionRequired')?.value==='yes'?Math.max(num('partitionQty'),0):0;

  const rows=BOM_CATALOGUE.map(x=>{
    const internalKey=resolvedInternalKey(x.key),remote=state.remoteByKey[internalKey]||{};
    const generatedQty=Number(qty[x.key]||0);
    const qtyOverride=remote.qtyOverride;
    // Important: an inactive line (for example L3/L4 on an 8 ft tank) always stays zero.
    const effectiveQty=generatedQty<=0?0:(qtyOverride===null||qtyOverride===undefined?generatedQty:Number(qtyOverride||0));
    return {...x,internalKey,item:remote.name||x.item,unit:remote.unit||x.unit,generatedQty,qty:effectiveQty,unitPrice:state.role==='main'?Number(remote.unitPrice||0):0,remoteMissing:!state.remoteByKey[internalKey],isCustom:false};
  });

  // Main-created custom BOM products are Supabase-backed and use their default quantity.
  state.remoteCatalogue.filter(x=>x.isCustom).forEach(x=>{
    const q=x.qtyOverride===null||x.qtyOverride===undefined?0:Number(x.qtyOverride||0);
    if(q>0) rows.push({key:x.internalKey,internalKey:x.internalKey,category:x.category||'Custom',item:x.name||'Custom Item',unit:x.unit||'pcs',generatedQty:q,qty:q,unitPrice:state.role==='main'?Number(x.unitPrice||0):0,remoteMissing:false,isCustom:true});
  });
  return {basis,exact:l===24&&w===24&&h===8,rows};
}

function renderCalculator(){
  page('Quick Calculator','Sales sees the final selling price. BOM names, quantity overrides, prices and defaults sync from Supabase.');
  view.innerHTML=`
  <div class="grid">
    <div class="card">
      <h2>Tank Details</h2>
      <div class="formGrid">
        <div class="field"><label>Length (ft)</label><input id="len" class="input" type="number" min="4" step="4" value="24" oninput="calc()"></div>
        <div class="field"><label>Width (ft)</label><input id="wid" class="input" type="number" min="4" step="4" value="24" oninput="calc()"></div>
        <div class="field"><label>Height (ft)</label><select id="hei" onchange="calc()"><option>4</option><option selected>8</option><option>12</option><option>16</option></select></div>
        <div class="field"><label>Quantity</label><input id="qty" class="input" type="number" min="1" value="1" oninput="calc()"></div>

        <div class="field"><label>Roof Thickness (mm)</label><input id="roofThickness" class="input" type="number" min="0" step="0.1" value="1.5" oninput="calc()"></div>
        <div class="field"><label>Base Thickness (mm)</label><input id="baseThickness" class="input" type="number" min="0" step="0.1" value="5.0" oninput="calc()"></div>
        <div class="field" id="wallL1Field"><label>Wall L1 Thickness (mm)</label><input id="wallL1Thickness" class="input" type="number" min="0" step="0.1" value="5.0" oninput="calc()"></div>
        <div class="field" id="wallL2Field"><label>Wall L2 Thickness (mm)</label><input id="wallL2Thickness" class="input" type="number" min="0" step="0.1" value="5.0" oninput="calc()"></div>
        <div class="field" id="wallL3Field"><label>Wall L3 Thickness (mm)</label><input id="wallL3Thickness" class="input" type="number" min="0" step="0.1" value="5.0" oninput="calc()"></div>
        <div class="field" id="wallL4Field"><label>Wall L4 Thickness (mm)</label><input id="wallL4Thickness" class="input" type="number" min="0" step="0.1" value="5.0" oninput="calc()"></div>

        <div class="field"><label>Partition</label><select id="partitionRequired" onchange="syncPartitionUi();calc()"><option value="no">No Partition</option><option value="yes">Partition Required</option></select></div>
        <div class="field" id="partitionTypeField"><label>Partition Type</label><select id="partitionType" onchange="calc()"><option>Internal panel partition</option><option>Single partition</option><option>Double partition</option><option>Custom partition</option></select></div>
        <div class="field" id="partitionLengthField"><label>Partition Length (ft)</label><input id="partitionLength" class="input" type="number" min="0" step="0.01" value="0" oninput="calc()"></div>
        <div class="field" id="partitionWidthField"><label>Partition Width / Height (ft)</label><input id="partitionWidth" class="input" type="number" min="0" step="0.01" value="0" oninput="calc()"></div>
        <div class="field" id="partitionQtyField"><label>Partition Qty</label><input id="partitionQty" class="input" type="number" min="0" step="1" value="1" oninput="calc()"></div>

        <div class="field"><label>Supply Type</label><select id="supply" onchange="calc()"><option value="supply">Supply Only</option><option value="install">Supply + Installation (+${money(state.settings.installation||0)})</option></select></div>

function recalcMainManualBom(){
  if(state.role!=='main'||!state.currentBom)return null;
  const tankQty=Math.max(1,num('qty'));
  const material=state.currentBom.rows.reduce((a,r)=>a+(Number(r.qty)||0)*(Number(r.unitPrice)||0),0)*tankQty;
  const installation=document.getElementById('supply')?.value==='install'?Number(state.settings.installation||0)*tankQty:0;
  const delivery=document.getElementById('delivery')?.value==='yes'?Number(state.settings.delivery||0)*tankQty:0;
  const other=Number(state.settings.other||0)*tankQty;
  const costBeforeMarkup=material+installation+delivery+other,markupRate=Number(state.settings.markup||0),markupAmount=costBeforeMarkup*markupRate/100,subtotal=costBeforeMarkup+markupAmount,sstRate=document.getElementById('sstOn')?.value==='yes'?Number(state.settings.sst||0):0,taxAmount=subtotal*sstRate/100,finalTotal=Math.round((subtotal+taxAmount+Number.EPSILON)*100)/100;
  state.currentManualTotals={material,installation,delivery,other,costBeforeMarkup,markupRate,markupAmount,subtotal,sstRate,taxAmount,finalTotal,currency:'MYR'};
  if(document.getElementById('sellPrice'))sellPrice.textContent=money(finalTotal);
  if(document.getElementById('taxLine'))taxLine.textContent=sstRate?`Includes ${sstRate}% SST`:'SST excluded';
  if(document.getElementById('mainBreakdown'))mainBreakdown.innerHTML=`Material: <b>${money(material)}</b><br>Installation: <b>${money(installation)}</b><br>Delivery: <b>${money(delivery)}</b><br>Other: <b>${money(other)}</b><br>Markup: <b>${markupRate}% (${money(markupAmount)})</b><br>Before SST: <b>${money(subtotal)}</b><br>SST: <b>${money(taxAmount)}</b>`;
  return state.currentManualTotals;
}
async function saveCurrentBomAsDefaults(){

    });

function renderBom(l,w,h){
  const bom=buildBom(l,w,h),b=bom.basis;
  const levels=activeWallLevels(h);
  [['wallL1','l1'],['wallL2','l2'],['wallL3','l3'],['wallL4','l4']].forEach(([rowKey,levelKey])=>{
    const row=bom.rows.find(x=>x.key===rowKey);
    if(row && !levels[levelKey]){row.generatedQty=0;row.qty=0;row.removed=true}
  });
  if(!validGrid(b)){bomPanels.textContent='Invalid';bomRoofBase.textContent='-';bomWall.textContent='-';bomDetail.innerHTML='';bomMethod.textContent='Dimensions must use 4 ft panel modules.';return null}
  bomPanels.textContent=Math.round(b.total);bomRoofBase.textContent=`Roof ${Math.round(b.roof)} / Base ${Math.round(b.roof)}`;bomWall.textContent=Math.round(b.wall);
  renderBomTableOnly(bom);
  const lv=activeWallLevels(h);
  const thickParts=[`Roof ${num('roofThickness').toFixed(1)}mm`,`Base ${num('baseThickness').toFixed(1)}mm`,`L1 ${num('wallL1Thickness').toFixed(1)}mm`,lv.l2?`L2 ${num('wallL2Thickness').toFixed(1)}mm`:null,lv.l3?`L3 ${num('wallL3Thickness').toFixed(1)}mm`:null,lv.l4?`L4 ${num('wallL4Thickness').toFixed(1)}mm`:null].filter(Boolean).join(' · ');
  const part=document.getElementById('partitionRequired')?.value==='yes'?` Partition: ${document.getElementById('partitionType')?.value||'Internal panel partition'}, ${num('partitionLength')} ft × ${num('partitionWidth')} ft × Qty ${num('partitionQty')}.`:' Partition: None.';
  const missing=bom.rows.filter(r=>r.qty>0&&r.remoteMissing).length;
  bomMethod.textContent=(bom.exact?'Verified 24×24×8 reference BOM is applied. ':'Original Excel-style formulas are used where available; wall panels are split by active 4 ft levels. ')+`Thickness: ${thickParts}.${part}`+(missing?` ${missing} active item(s) are not mapped in Supabase.`:' Supabase BOM sync active.');
  return bom;
}

function calc(){
  syncWallLevelUi();syncPartitionUi();
  const l=num('len'),w=num('wid'),h=num('hei'),q=Math.max(1,num('qty')),bom=renderBom(l,w,h);
  sizeText.textContent=`${l}' × ${w}' × ${h}'`;panelText.textContent=bom?Math.round(bom.basis.total):0;qtyText.textContent=q;
  if(!bom){sellPrice.textContent='—';return {l,w,h,q,total:0,bom:null}}
  sellPrice.textContent='Calculating…';scheduleRemotePrice(bom,q);
  return {l,w,h,q,total:Number(state.lastPrice?.totals?.finalTotal||0),bom};
}
let priceTimer=null;
function scheduleRemotePrice(bom,q){
  clearTimeout(priceTimer);const seq=++state.priceSeq;priceTimer=setTimeout(()=>remotePrice(bom,q,seq),180);
}
async function remotePrice(bom,q,seq=++state.priceSeq){
  try{
    const r=await api('quick_price',{
      rows:bom.rows.filter(x=>x.generatedQty>0||x.qty>0).map(x=>({internalKey:x.internalKey,quantity:x.generatedQty})),
      tankQty:q,
      includeInstallation:document.getElementById('supply')?.value==='install',
      includeDelivery:document.getElementById('delivery')?.value==='yes',
      includeTax:document.getElementById('sstOn')?.value==='yes'
    });
    if(seq!==state.priceSeq)return r;
    state.lastPrice=r;const t=r.totals||{};
    sellPrice.textContent=money(t.finalTotal||0);taxLine.textContent=t.sstRate?`Includes ${Number(t.sstRate)}% SST`:'SST excluded';
    if(state.role==='main'&&document.getElementById('mainBreakdown'))mainBreakdown.innerHTML=`Material: <b>${money(t.material||0)}</b><br>Installation: <b>${money(t.installation||0)}</b><br>Delivery: <b>${money(t.delivery||0)}</b><br>Other: <b>${money(t.other||0)}</b><br>Markup: <b>${Number(t.markupRate||0)}% (${money(t.markupAmount||0)})</b><br>Before SST: <b>${money(t.subtotal||0)}</b><br>SST: <b>${money(t.taxAmount||0)}</b>`;
    const qmap=Object.fromEntries((r.rows||[]).map(x=>[x.internalKey,Number(x.quantity||0)]));
    bom.rows.forEach(x=>{
      if(Number(x.generatedQty||0)<=0 && !x.isCustom){x.qty=0;return}
      if(qmap[x.internalKey]!==undefined)x.qty=qmap[x.internalKey];
    });
    renderBomTableOnly(bom);
    return r;
  }catch(e){if(seq!==state.priceSeq)return null;sellPrice.textContent='Sync error';taxLine.textContent=e.message||'Unable to calculate from Supabase';return null}
}
async function saveQuote(){
  const r=calc();if(!r.bom)return;
  let totals,bom;
  if(state.role==='main'){
    totals=recalcMainManualBom()||state.lastPrice?.totals;
    bom=state.currentBom.rows.filter(x=>x.qty>0).map(x=>({internalKey:x.internalKey,name:rowDisplayName(x),quantity:Number(x.qty||0),unit:x.unit,category:x.category,unitPrice:Number(x.unitPrice||0)}));
  }else{
    const priced=await remotePrice(r.bom,r.q);if(!priced?.totals)return alert('Unable to save quote until Supabase pricing is available.');
    totals=priced.totals;
    const qmap=Object.fromEntries((priced.rows||[]).map(x=>[x.internalKey,Number(x.quantity||0)]));
    bom=r.bom.rows.filter(x=>(qmap[x.internalKey]??x.qty)>0).map(x=>({internalKey:x.internalKey,name:rowDisplayName(x),quantity:Number(qmap[x.internalKey]??x.qty),unit:x.unit,category:x.category}));
  }
  const quote=await api('quick_quote_save',{
    customer:customer.value.trim(),project:document.getElementById('project')?.value.trim()||'',
    size:`${r.l}' × ${r.w}' × ${r.h}'`,qty:r.q,bom,totals,status:'Sales Quote',
    tank:{length:r.l,width:r.w,height:r.h,roofThickness:num('roofThickness'),baseThickness:num('baseThickness'),wallL1Thickness:num('wallL1Thickness'),wallL2Thickness:num('wallL2Thickness'),wallL3Thickness:num('wallL3Thickness'),wallL4Thickness:num('wallL4Thickness'),partitionRequired:document.getElementById('partitionRequired')?.value,partitionType:document.getElementById('partitionType')?.value,partitionLength:num('partitionLength'),partitionWidth:num('partitionWidth'),partitionQty:num('partitionQty'),includeInstallation:document.getElementById('supply')?.value==='install',includeDelivery:document.getElementById('delivery')?.value==='yes',includeTax:document.getElementById('sstOn')?.value==='yes'}
  });
  alert(`Sales quote saved to Supabase${quote.quote?.customer?' for '+quote.quote.customer:''}.`);
}

    const items=state.remoteCatalogue.map(x=>({internalKey:x.internalKey,isCustom:!!x.isCustom,category:x.category,unit:x.unit,name:document.getElementById('name_'+x.internalKey)?.value||x.name,qtyOverride:(document.getElementById('qty_'+x.internalKey)?.value??'')===''?null:Number(document.getElementById('qty_'+x.internalKey).value),unitPrice:Number(document.getElementById('price_'+x.internalKey)?.value||0)}));
    const defaults={installation:num('installationP'),delivery:num('deliveryP'),other:num('otherP'),markup:num('markupP'),sst:num('sstP'),currency:'MYR'};
    await api('quick_save',{items,defaults});await loadRemoteConfig();alert('BOM names, quantities, prices and defaults saved to Supabase.');renderPrices();
  }catch(e){alert(e.message||'Unable to save to Supabase')}
}
</script>
</body>
