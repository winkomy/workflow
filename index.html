.meetingKpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.meetingKpi{padding:14px}.meetingKpi .val{font-size:28px;font-weight:900}.meetingKpi .lab{font-size:10px;font-weight:850;color:var(--muted);text-transform:uppercase}.meetingToolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.meetingTable table{min-width:1450px}.meetingTable td{vertical-align:middle}.meetingIssue{max-width:230px;white-space:normal;line-height:1.35}.meetingAction{max-width:260px;white-space:normal;line-height:1.35}.meetingCritical td{background:#fff5f5!important}.meetingSoon td{background:#fffaf0!important}@media(max-width:900px){.meetingKpis{grid-template-columns:repeat(2,1fr)}}

function recalcActiveDeadlines(){const seen=new Set();state.jobs.filter(j=>!j.archived).forEach(j=>{if(seen.has(j.ref))return;seen.add(j.ref);const active=activeStageKey(j);if(active)resetFutureDue(j,stages.indexOf(active))});ensureWorkflow()}
function saveSettings(){const oldDays=getSettings().slaDays;state.settings={...getSettings(),slaDays:Math.max(1,Math.min(30,Number(sSla.value)||3)),urgentDays:Math.max(0,Math.min(30,Number(sUrgent.value)||3)),tbcLabel:cleanText(sTbc.value,20)||'TBC'};if(state.settings.slaDays!==oldDays)recalcActiveDeadlines();applyBrand();logActivity('System settings updated');persist();renderSettings()}
function resetSettings(){state.settings={slaDays:3,tbcLabel:'TBC',urgentDays:3};recalcActiveDeadlines();applyBrand();persist();renderSettings()}
function renderArchive(){title('Archive','Archived PO lines are hidden from PO, Workflow and Delivery until restored.');const rows=state.jobs.filter(j=>j.archived).filter(matches);view.innerHTML=`<div class="card section"><div class="sectionHead"><div><h2>Archived PO Lines</h2><div class="note">Restore is recommended. Permanent delete cannot be undone.</div></div><input class="input" placeholder="Search archive..." value="${esc(state.search)}" oninput="state.search=this.value;renderArchive()"></div><div class="tableWrap"><table><thead><tr><th>Archived</th><th>Month</th><th>PO No.</th><th>Job</th><th>Customer</th><th>Project / Tank</th><th></th></tr></thead><tbody>${rows.map(j=>`<tr class="archiveRow"><td>${j.archivedAt?new Date(j.archivedAt).toLocaleString('en-MY'):'—'}</td><td>${esc(poMonthName(j.sourceMonth))}</td><td>${esc(j.poNo)}</td><td><b>${esc(j.ref)}</b></td><td>${esc(j.customer)}</td><td>${esc(j.project||j.tankSize)}</td><td><div class="actions"><button class="btn" onclick="restorePO('${j.id}')">Restore</button><button class="btn danger" onclick="permanentDelete('${j.id}')">Delete Permanently</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function restorePO(id){const j=state.jobs.find(x=>x.id===id);if(!j||!j.archived)return;const active=state.jobs.find(x=>!x.archived&&x.ref===j.ref);j.archived=false;delete j.archivedAt;if(active){j.stages={...(active.stages||{})};j.stageDates={...(active.stageDates||{})};j.stageDue={...(active.stageDue||{})};j.deliveryStatus=active.deliveryStatus||j.deliveryStatus;j.priority=active.priority||j.priority}ensureWorkflow();logActivity(`PO ${j.poNo||''} restored`,j.ref);persist();renderArchive()}
function permanentDelete(id){const j=state.jobs.find(x=>x.id===id);if(!j||!confirm(`Permanently delete ${j.poNo||''} / ${j.ref||''}?\n\nThis cannot be undone.`))return;state.jobs=state.jobs.filter(x=>x.id!==id);logActivity(`PO ${j.poNo||''} permanently deleted`,j.ref);persist();renderArchive()}
const fieldMap={fSource:'sourceMonth',fPoDate:'poDate',fPoNo:'poNo',fRef:'ref',fCustomer:'customer',fDoDate:'doDate',fDeliveryDate:'deliveryDate',fDoNo:'doNo',fTank:'tankSize',fProject:'project',fAddress:'projectAddress',fPoRemarks:'poRemarks',fPanel:'panel',fCover:'cover',fInstaller:'installer',fInstallerDate:'installerDate',fLetter:'letterCantInstall',fVoucher:'voucherCheque',fExtra:'extraWorks',fPriority:'priority',fStatus:'deliveryStatus',fBlocker:'blocker',fNextAction:'nextAction',fNextActionDue:'nextActionDue',fTransport:'transport',fSubcon:'subcon',fRemarks:'remarks'};
function openModal(id=null){state.editing=id;const j=id?state.jobs.find(x=>x.id===id):{sourceMonth:state.poMonth==='all'?'2608':state.poMonth,priority:'NORMAL',deliveryStatus:'Pending',stages:{po:false,bom:false,drawing:false,opening:false,production:false,delivery:false},stageDates:{},stageDue:{}};modalTitle.textContent=id?'Edit PO / Job':'Add PO / Job';Object.entries(fieldMap).forEach(([el,k])=>document.getElementById(el).value=j[k]||'');modal.classList.add('show')}function closeModal(){modal.classList.remove('show');state.editing=null}
function validateJobInput(o){if(!o.ref||!o.customer)return'Job / Reference and Customer are required.';if(o.sourceMonth&&!/^26(0[1-9]|1[0-2])$/.test(o.sourceMonth))return'Source month must use format 2601 to 2612.';for(const [k,label] of [['poDate','PO Date'],['doDate','Inv/DO Date'],['deliveryDate','Delivery Date'],['installerDate','Installer Date'],['nextActionDue','Action Due Date']])if(!validISODate(o[k]))return`${label} is invalid.`;const poDup=state.jobs.find(x=>!x.archived&&x.id!==state.editing&&o.poNo&&x.poNo&&x.poNo.toLowerCase()===o.poNo.toLowerCase()&&x.ref!==o.ref);if(poDup&&!confirm(`PO No. ${o.poNo} already exists under ${poDup.ref}.\n\nSave anyway?`))return'__cancel__';return''}
function saveJob(){const btn=document.getElementById('saveJobBtn');if(btn?.disabled)return;const o={};Object.entries(fieldMap).forEach(([el,k])=>o[k]=cleanText(document.getElementById(el).value,k==='remarks'||k==='poRemarks'||k==='projectAddress'?2000:500));const err=validateJobInput(o);if(err){if(err!=='__cancel__')alert(err);return}btn.disabled=true;btn.textContent='Saving…';try{if(state.editing){const j=state.jobs.find(x=>x.id===state.editing);if(!j)return;const oldRef=j.ref,oldDo=j.doDate,st={...(j.stages||{})},sd={...(j.stageDates||{})},due={...(j.stageDue||{})},jobId=j.jobId;if(oldDo&&!o.doDate&&Object.values(st).some(Boolean)&&!confirm('Workflow has already started. Removing Inv/DO Date may reset workflow due dates. Continue?'))return;Object.assign(j,o);j.jobId=jobId;state.jobs.filter(x=>!x.archived&&x.jobId===jobId&&x.id!==j.id).forEach(x=>{x.deliveryDate=o.deliveryDate;x.priority=o.priority;x.blocker=o.blocker;x.nextAction=o.nextAction;x.nextActionDue=o.nextActionDue;x.transport=o.transport;x.subcon=o.subcon;});j.stages=st;j.stageDates=sd;j.stageDue=due;if(j.deliveryStatus==='Delivered'){j.stages.delivery=true;j.stageDates.delivery=j.stageDates.delivery||isoToday()}else if(j.stages.delivery){j.stages.delivery=false;delete j.stageDates.delivery}logActivity(`PO ${j.poNo||''} updated`,j.ref);if(oldRef!==j.ref)logActivity(`Job reference changed from ${oldRef}`,j.ref)}else{const existing=state.jobs.find(x=>!x.archived&&x.ref.trim().toLowerCase()===o.ref.trim().toLowerCase());const j=normalizeJob({id:crypto.randomUUID(),jobId:existing?.jobId||(crypto.randomUUID?crypto.randomUUID():`job-${Date.now()}`),...o,stages:{po:false,bom:false,drawing:false,opening:false,production:false,delivery:false},stageDates:{},stageDue:{}});state.jobs.push(j);logActivity(`PO ${j.poNo||''} added`,j.ref)}normalizeAllJobs();ensureWorkflow();persist();closeModal();render()}finally{if(btn){btn.disabled=false;btn.textContent='Save'}}}

function importNorm(v){return String(v??'').trim().replace(/\s+/g,' ').toLowerCase()}
function projectDuplicateKey(j){return [j.sourceMonth,j.poNo,j.ref,j.customer,j.tankSize,j.project].map(importNorm).join('|')}
function excelCellToISO(v){
  if(!v)return'';
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number'&&window.XLSX?.SSF){const d=XLSX.SSF.parse_date_code(v);if(d)return `${String(d.y).padStart(4,'0')}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
  const t=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;
  const d=new Date(t);return isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}
function makeImportJobId(row,sourceMonth,jobMap){
  const ref=cleanText(row[3],500),po=cleanText(row[2],500),cust=cleanText(row[1],500);
  const meaningfulRef=ref&&ref!=='-';
  const key=meaningfulRef?`ref:${importNorm(ref)}`:`po:${importNorm(sourceMonth)}|${importNorm(po)}|${importNorm(cust)}`;
  if(!jobMap.has(key))jobMap.set(key,(crypto.randomUUID?crypto.randomUUID():`job-${Date.now()}-${Math.random().toString(36).slice(2)}`));
  return jobMap.get(key)
}
async function importProjectListFile(file){
  const input=document.getElementById('projectImportInput');
  try{
    if(!file)return;
    if(!window.XLSX)throw new Error('Excel importer could not load. Check internet access and reload the page.');
    setDbStatus('Reading project list…','connected');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    const monthSheets=wb.SheetNames.filter(n=>/^26(0[1-9]|1[0-2])$/.test(String(n)));
    if(!monthSheets.length)throw new Error('No monthly sheets such as 2607 or 2608 were found.');
    const existingKeys=new Set(state.jobs.map(projectDuplicateKey));
    const incomingKeys=new Set();
    const refToJobId=new Map();
    state.jobs.forEach(j=>{if(j.ref&&j.ref!=='-'&&j.jobId)refToJobId.set(`ref:${importNorm(j.ref)}`,j.jobId)});
    const additions=[];let duplicates=0,skipped=0,readRows=0;
    for(const sourceMonth of monthSheets){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sourceMonth],{header:1,defval:'',raw:true});
      for(let i=1;i<rows.length;i++){
        const r=rows[i]||[];
        if(!r.some(v=>String(v??'').trim()))continue;
        readRows++;
        const customer=cleanText(r[1],500),poNo=cleanText(r[2],500),rawRef=cleanText(r[3],500),tankSize=cleanText(r[6],500),project=cleanText(r[8],500);
        if(!customer||(!poNo&&!rawRef&&!tankSize&&!project)){skipped++;continue}
        const ref=rawRef||'-';
        const job={
          id:(crypto.randomUUID?crypto.randomUUID():`line-${Date.now()}-${Math.random().toString(36).slice(2)}`),
          jobId:makeImportJobId(r,sourceMonth,refToJobId),sourceMonth:String(sourceMonth),poDate:excelCellToISO(r[0]),poNo,ref,customer,
          doDate:excelCellToISO(r[4]),deliveryDate:'',doNo:cleanText(r[5],500),tankSize,poRemarks:cleanText(r[7],2000),project,projectAddress:cleanText(r[9],2000),
          panel:cleanText(r[10],500),cover:cleanText(r[11],500),installer:cleanText(r[12],500),installerDate:excelCellToISO(r[13]),letterCantInstall:cleanText(r[14],500),
          voucherCheque:cleanText(r[15],500),extraWorks:cleanText(r[16],500),remarks:cleanText(r[17],2000),priority:'NORMAL',deliveryStatus:'Pending',pic:'',transport:'',subcon:'',
          stages:{po:false,bom:false,drawing:false,opening:false,production:false,delivery:false},stageDates:{},stageDue:{}
        };
        const key=projectDuplicateKey(job);
        if(existingKeys.has(key)||incomingKeys.has(key)){duplicates++;continue}
        incomingKeys.add(key);additions.push(job)
      }
    }
    const msg=`Import Project List?\n\nFile: ${file.name}\nSheets: ${monthSheets.join(', ')}\nRows read: ${readRows}\nNew PO lines: ${additions.length}\nDuplicates skipped: ${duplicates}\nInvalid/blank rows skipped: ${skipped}\n\nDuplicate lines will NOT be imported.`;
    if(!additions.length){alert(`${msg}\n\nNo new data to import.`);setDbStatus('No new project data','connected');return}
    if(!confirm(msg))return;
    localStorage.setItem(STORAGE_KEY+'_pre_project_import',JSON.stringify(snapshotState()));
    state.jobs.push(...additions);normalizeAllJobs();ensureWorkflow();
    logActivity(`Project List imported: ${additions.length} new line(s), ${duplicates} duplicate(s) skipped`);
    persist();renderNav();render();
    alert(`Import completed.\n\n${additions.length} new PO line(s) imported.\n${duplicates} duplicate line(s) skipped.\n${skipped} invalid/blank row(s) skipped.`)
  }catch(e){console.error(e);alert(`Cannot import project list: ${e.message||e}`);setDbStatus('Project import failed','error')}
  finally{if(input)input.value=''}
}

function exportData(){const payload={version:DATA_VERSION,exportedAt:new Date().toISOString(),jobs:state.jobs,activity:state.activity||[],settings:getSettings()};const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.href=url;a.download=`jutarama-backup-${isoToday()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);localStorage.setItem(BACKUP_KEY,new Date().toLocaleString('en-MY'));setDbStatus('Backup downloaded','connected');if(state.view==='more')renderMore()}
async function importBackupFile(file){const input=document.getElementById('backupImportInput');try{if(!file)return;const text=await file.text();const data=JSON.parse(text);if(!data||!Array.isArray(data.jobs))throw new Error('Backup does not contain a valid jobs list.');const valid=data.jobs.every(x=>x&&typeof x==='object');if(!valid)throw new Error('Backup contains invalid job records.');const refs=new Set(data.jobs.map(x=>String(x.ref||'')).filter(Boolean));if(!confirm(`Restore this backup?\n\n${data.jobs.length} PO line(s)\n${refs.size} job reference(s)\nBackup: ${data.exportedAt?new Date(data.exportedAt).toLocaleString('en-MY'):'Unknown date'}\n\nThis will replace current local data.`))return;localStorage.setItem(STORAGE_KEY+'_rollback',JSON.stringify(snapshotState()));state.jobs=data.jobs;state.activity=Array.isArray(data.activity)?data.activity:[];state.settings={...state.settings,...(data.settings||{})};normalizeAllJobs();getSettings();ensureWorkflow();persist();renderNav();render();alert('Backup restored successfully.')}catch(e){alert(`Cannot restore backup: ${e.message||e}`)}finally{if(input)input.value=''}}
load();
</script></body></html>
